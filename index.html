<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#176b45">
  <title>BINGO | Online Shopping</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #202820;
      background: #f6f8f5;
    }
    header {
      background: #176b45;
      color: white;
      padding: 22px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand { font-size: 29px; font-weight: 800; letter-spacing: 1px; }
    .tagline { font-size: 13px; opacity: .9; margin-top: 4px; }
    .hero {
      padding: 54px 6%;
      background: linear-gradient(120deg, #e4f3e9, #f7fbf4);
    }
    .hero h1 { margin: 0 0 12px; font-size: clamp(30px, 5vw, 48px); color: #145638; }
    .hero p { margin: 0; font-size: 17px; color: #4c5d50; }
    main { padding: 34px 6% 60px; max-width: 1200px; margin: auto; }
    .section-title { margin: 0 0 22px; font-size: 25px; }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 20px;
    }
    .product {
      background: white;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 3px 14px rgba(20, 60, 35, .07);
      border: 1px solid #e8eee8;
    }
    .product-image {
      height: 135px;
      display: grid;
      place-items: center;
      background: #f0f7ef;
      border-radius: 10px;
      font-size: 66px;
      margin-bottom: 15px;
    }
    .product h3 { margin: 0 0 8px; font-size: 18px; }
    .price { color: #176b45; font-weight: 700; font-size: 17px; }
    footer {
      background: #123f2b;
      color: #e8f3eb;
      text-align: center;
      padding: 20px;
      font-size: 13px;
    }
    @media (max-width: 520px) {
      header { padding: 18px 5%; }
      .brand { font-size: 25px; }
      .hero { padding: 40px 5%; }
      main { padding: 28px 5% 45px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="brand">BINGO</div>
      <div class="tagline">Your local shopping place</div>
    </div>
  </header>

  <section class="hero">
    <h1>Welcome to BINGO</h1>
    <p>Explore everyday products in one place.</p>
  </section>

  <main>
    <h2 class="section-title">Our Products</h2>
    <section class="products" aria-label="Products">
      <article class="product">
        <div class="product-image" aria-hidden="true">🍌</div>
        <h3>Banana</h3>
        <div class="price">Rs. 250 / kg</div>
      </article>
      <article class="product">
        <div class="product-image" aria-hidden="true">🍎</div>
        <h3>Apple</h3>
        <div class="price">Rs. 900 / kg</div>
      </article>
      <article class="product">
        <div class="product-image" aria-hidden="true">🥕</div>
        <h3>Carrot</h3>
        <div class="price">Price to be updated</div>
      </article>
      <article class="product">
        <div class="product-image" aria-hidden="true">🍅</div>
        <h3>Tomato</h3>
        <div class="price">Price to be updated</div>
      </article>
    </section>
  </main>

  <footer>© 2026 BINGO. All rights reserved.</footer>
</body>
</html>
